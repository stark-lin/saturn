# This Compose file runs Saturn from the published GHCR image with PostgreSQL,
# Redis, and local file storage. The web app is exposed on port 8080, while
# PostgreSQL and Redis are published on loopback for host-machine development.
services:
  app:
    image: ghcr.io/stark-lin/saturn:latest
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    volumes:
      - objects-data:/app/objects

  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: saturn
      POSTGRES_USER: saturn
      POSTGRES_PASSWORD: saturn
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres-data:
  objects-data:
